<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="section">
    <a class="underlined-link" href="shop.html">← Back to shop</a>
    <section id="product-detail"></section>
  </main>

  <script src="script.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const product = products.find(p => p.id === id);
    const container = document.getElementById("product-detail");

    if (!product) {
      container.innerHTML = "<p>Product not found.</p>";
    } else {
      const basePrice = product.price || 0;
      const allImages = [
        ...(product.image ? [{ src: product.image, alt: product.title }] : []),
        ...(Array.isArray(product.images) ? product.images : [])
      ].filter(img => img && img.src);

      let selectedIndex = 0;

      container.innerHTML = `
        <div>
          <p class="eyebrow">${product.category || ""}</p>
          <h1>${product.title}</h1>
          <p class="price">From Rs ${basePrice.toLocaleString("en-MU")}</p>

          <!-- Carousel moved up directly under title/price -->
          <div class="product-carousel" aria-label="${product.title} image carousel">
            <div class="carousel-frame">
              <img id="carousel-image" class="product-detail-image"
                src="${allImages[0]?.src || ""}"
                alt="${allImages[0]?.alt || product.title}" />
              <button id="carousel-prev" class="gallery-control gallery-previous" type="button" aria-label="Previous image">←</button>
              <button id="carousel-next" class="gallery-control gallery-next" type="button" aria-label="Next image">→</button>
            </div>
            <div id="carousel-dots" class="gallery-indicators"></div>
            <p id="carousel-status" class="sr-only" aria-live="polite"></p>
          </div>

          <p class="description">${product.description || ""}</p>

          <div class="detail-row">
            <label>Choose your size</label>
            <div class="sizes">
              <button class="size-option active" data-size="A4">A4 · Rs ${basePrice.toLocaleString("en-MU")}</button>
              <button class="size-option" data-size="A3">A3 · Rs ${(basePrice + 700).toLocaleString("en-MU")}</button>
              <button class="size-option" data-size="A2">A2 · Rs ${(basePrice + 1550).toLocaleString("en-MU")}</button>
            </div>
          </div>

          <div class="detail-row">
            <label>Paper</label>
            <p>${product.paper || "310gsm textured archival fine-art paper"}</p>
          </div>

          <div class="detail-row">
            <label>Shipping costs</label>
            <p>${product.shipping || "Local and international postage cost an extra Rs 50 and Rs 200 respectively."}</p>
          </div>
        </div>
      `;

      const imageEl = document.getElementById("carousel-image");
      const dotsEl = document.getElementById("carousel-dots");
      const statusEl = document.getElementById("carousel-status");
      const prevBtn = document.getElementById("carousel-prev");
      const nextBtn = document.getElementById("carousel-next");

      function renderDots() {
        dotsEl.innerHTML = allImages.map((_, i) => `
          <button class="gallery-indicator${i === selectedIndex ? " active" : ""}" data-index="${i}" aria-label="Show image ${i + 1}"></button>
        `).join("");
        dotsEl.querySelectorAll(".gallery-indicator").forEach(btn => {
          btn.addEventListener("click", () => {
            selectedIndex = Number(btn.dataset.index);
            renderCarousel();
          });
        });
      }

      function renderCarousel() {
        if (!allImages.length) return;
        const current = allImages[selectedIndex];
        imageEl.src = current.src;
        imageEl.alt = current.alt || product.title;
        statusEl.textContent = `Image ${selectedIndex + 1} of ${allImages.length}`;
        renderDots();
      }

      function move(step) {
        if (!allImages.length) return;
        selectedIndex = (selectedIndex + step + allImages.length) % allImages.length;
        renderCarousel();
      }

      prevBtn.addEventListener("click", () => move(-1));
      nextBtn.addEventListener("click", () => move(1));

      renderCarousel();

      document.querySelectorAll(".size-option").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".size-option").forEach((b) => b.classList.remove("active"));
          button.classList.add("active");
        });
      });
    }
  </script>
</body>
</html>
