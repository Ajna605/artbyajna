<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="section">
    <a class="underlined-link" href="shop.html">← Back to shop</a>
    <section class="product-detail">
      <h1 id="title"></h1>
      <p id="category"></p>
      <p id="price"></p>
      <p id="description"></p>
      <div id="gallery"></div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const product = products.find(p => p.id === id);

    if (!product) {
      document.querySelector(".product-detail").innerHTML = "<p>Product not found.</p>";
    } else {
      document.getElementById("title").textContent = product.title;
      document.getElementById("category").textContent = product.category;
      document.getElementById("price").textContent = `Rs ${product.price}`;
      document.getElementById("description").textContent = product.description || "";

      const gallery = document.getElementById("gallery");
      const allImages = [{ src: product.image, alt: product.title }, ...(product.images || [])];

      gallery.innerHTML = allImages.map(img => `
        <img src="${img.src}" alt="${img.alt || product.title}" style="max-width: 280px; margin: 8px;" />
      `).join("");
    }
  </script>
</body>
</html>
