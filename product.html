<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="section product-page">
    <a class="underlined-link back-link" href="shop.html">← Back to shop</a>
    <section id="product-detail"></section>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("product-detail");
      if (!container) return;

      const id = new URLSearchParams(window.location.search).get("id");
      if (typeof products === "undefined" || !Array.isArray(products)) {
        container.innerHTML = "<p>Products data failed to load.</p>";
        return;
      }

      const product = products.find(p => String(p.id) === String(id));
      if (!product) {
        container.innerHTML = "<p>Product not found.</p>";
        return;
      }

      container.innerHTML = `<h1>${product.title}</h1><p>${product.description || ""}</p>`;
    });
  </script>
</body>
</html>
